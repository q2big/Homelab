<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Domain for sale</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; word-break: break-all; }
    p { color: #94a3b8; font-size: 1.1rem; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <h1 id="domain">This domain</h1>
    <p>is for sale.</p>
    <p>Interested? Contact <a href="mailto:<desired_email>"><desired_email></a></p>
  </main>
  <script>document.getElementById("domain").textContent = location.hostname.replace(/^www\./, "");</script>
</body>
</html>
